    <text x="527" y="496" fill="#cbd5e1" font-size="17">unavailable</text>
    <rect x="718" y="345" width="196" height="190" rx="20" fill="#2e2237" stroke="#a78bfa" stroke-width="2"/>
    <text x="743" y="390" fill="#c4b5fd" font-size="18" font-weight="700">CLAIM 4</text>
    <text x="743" y="430" fill="#f8fafc" font-size="25" font-weight="700">BLOCKED</text>
