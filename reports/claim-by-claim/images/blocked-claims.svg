    <text x="130" y="527" fill="#6b21a8" font-size="17">wrong model state; no classifiers or judge</text>
    <rect x="630" y="165" width="500" height="410" rx="24" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
